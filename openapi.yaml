  /v1/code_sample:
    get:
      summary: Retrieve usage snippets
      description: >-
        Retrieve usage snippets from an OpenAPI document stored in the registry. Supports filtering by language and operation ID.
      operationId: getCodeSamples
      x-speakeasy-name-override: get
      tags:
        - CodeSamples
      parameters:
        - name: registry_url
          description: The registry URL from which to retrieve the snippets.
          in: query
          required: true
          example: https://spec.speakeasy.com/my-org/my-workspace/my-source
          schema:
            type: string
        - name: operation_ids
          description: The operation IDs to retrieve snippets for.
          in: query
          required: false
          example: "getPets"
          schema:
            type: array
            items:
              type: string
        - name: method_paths
          description: The method paths to retrieve snippets for.
          in: query
          required: false
          example: [{"method": "get", "path": "/pets"}]
          schema:
            type: array
            items:
              type: object
              required: ["method", "path"]
              properties:
                method:
                  $ref: "#/components/schemas/HttpMethod"
                path:
                  type: string
        - name: languages
          description: The languages to retrieve snippets for.
          in: query
          required: false
          example: ["python", "javascript"]
          schema:
            type: array
            items:
              type: string
      responses:
        "2XX":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSnippets"
              examples:
                default:
                  $ref: "#/components/examples/UsageSnippets"
        4XX:
          $ref: "#/components/responses/default"
      x-codeSamples:
        - lang: go
          label: getCodeSamples
          source: |-
            package main

            import(
            	"context"
            	"github.com/speakeasy-api/speakeasy-client-sdk-go/v3/pkg/models/shared"
            	speakeasyclientsdkgo "github.com/speakeasy-api/speakeasy-client-sdk-go/v3"
            	"github.com/speakeasy-api/speakeasy-client-sdk-go/v3/pkg/models/operations"
            	"log"
            )

            func main() {
                ctx := context.Background()

                s := speakeasyclientsdkgo.New(
                    speakeasyclientsdkgo.WithSecurity(shared.Security{
                        APIKey: speakeasyclientsdkgo.Pointer("<YOUR_API_KEY_HERE>"),
                    }),
                )

                res, err := s.CodeSamples.Get(ctx, operations.GetCodeSamplesRequest{
                    Languages: []string{
                        "python",
                        "javascript",
                    },
                    MethodPaths: []operations.MethodPaths{
                        operations.MethodPaths{
                            Method: shared.HTTPMethodGet,
                            Path: "/pets",
                        },
                    },
                    OperationIds: []string{
                        "g",
                        "e",
                        "t",
                        "P",
                        "e",
                        "t",
                        "s",
                    },
                    RegistryURL: "https://spec.speakeasy.com/my-org/my-workspace/my-source",
                })
                if err != nil {
                    log.Fatal(err)
                }
                if res.UsageSnippets != nil {
                    // handle response
                }
            }
