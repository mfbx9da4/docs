              readOnly: true
            subscription_settings:
              $ref: '#/components/schemas/RemoteSourceSubscriptionSettings'
          required:
            - subscription_id
            - subscription_settings
      required:
        - id
        - name
        - created_at
        - updated_at
      description: A namespace contains many revisions.
    RemoteSourceSubscriptionSettings:
      properties:
        base_spec_namespaces:
          type: array
          items:
            type: string
        overlay_namespaces:
          type: array
          items:
            type: string
        ignored_namespaces:
          type: array
          items:
            type: string
        output_namespace:
          type: string
      required:
        - base_spec_namespaces
        - overlay_namespaces
        - output_namespace
    Revision:
      properties:
        id:
          type: string
          description: Format {namespace_id}/{revision_digest}
        digest:
          type: string
          example: sha256:6d1ef012b5674ad8a127ecfa9b5e6f5178d171b90ee462846974177fd9bdd39f
        namespace_name:
          type: string
        tags:
          type: array
          items:
            type: string
        contents_metadata:
          $ref: '#/components/schemas/RevisionContentsMetadata'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - namespace_name
        - digest
        - tags
        - created_at
        - updated_at
    RevisionContentsMetadata:
      properties:
        type:
          type: string
          enum:
            - OPENAPI_BUNDLE
            - OPENAPI_OVERLAY
        workspace_id:
          type: string
          description: The workspace ID
        namespace:
          type: string
          description: The fully qualified namespace
        revision_digest:
          type: string
          description: The digest of the parent bundle
        title:
          type: string
          description: The OAS title
        description:
          type: string
          description: The OAS description
        version:
          type: string
          description: The OAS version
        hash:
          type: string
          description: The hash of the contents
        tags:
          type: array
          items:
            type: string
          description: The tags contained in the OAS -- NOT the OCI tags. Will be empty if the OAS is an overlay.
        operation_ids:
          type: array
          items:
            type: string
          description: The operation IDs contained in the OAS. Will be empty if the OAS is an overlay.
        num_overlay_actions:
          type: integer
          description: The number of overlay actions in the OAS. Will be 0 if the OAS is not an overlay.
        contains_code_samples:
          type: boolean
          description: Whether the OAS contains code samples.
        relative_diff:
          $ref: '#/components/schemas/RelativeDiff'
          description: The relative diff between the current revision and its surrounding revisions
        created_at:
          type: string
          format: date-time
          readOnly: true
        server_urls:
          type: array
          items:
            $ref: '#/components/schemas/Server'
          description: The servers contained in the OAS. Will be empty if the OAS is an overlay.
      required:
        - workspace_id
        - namespace
        - revision_digest
        - type
        - title
        - description
        - version
        - hash
        - tags
        - operation_ids
        - num_overlay_actions
        - contains_code_samples
        - created_at
        - server_urls
    AddTags:
      type: object
      properties:
        revision_digest:
          type: string
          description: revision digest to add tags too sha256:...
        tags:
          type: array
          items:
            type: string
          description: string tags to add to the revision
      required:
        - revision_digest
        - tags
      description: Request body of tags to add to a revision
    RemoteSource:
      properties:
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/RemoteDocument'
        overlays:
          type: array
          items:
            $ref: '#/components/schemas/RemoteDocument'
        output:
          $ref: '#/components/schemas/RemoteDocument'
      required:
        - inputs
        - output
      description: Remote source configuration
    RelativeDiff:
      properties:
        added_lines:
          type: integer
          description: The number of lines added against the previous revision
        removed_lines:
          type: integer
          description: The number of lines removed against the previous revision
      description: A relative diff between the current revision and the previous revision.
    Server:
      properties:
        url:
          type: string
        description:
          type: string
        id:
          type: string
          description: The x-speakeasy-server-id of the server
      required:
        - url
        - description
      description: A server as defined in an OpenAPI document
    RemoteDocument:
      properties:
        registry_url:
          type: string
      required:
        - registry_url
      description: A document hosted in the registry
